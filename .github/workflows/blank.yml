
name: SERTZIO Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android Project
        run: |
          unzip -q SERTZIO_Android_Project_PhoneBuild.zip -d project

      - name: Build APK
        run: |
          cd project/SERTZIOAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SERTZIO-Android-APK
          path: project/SERTZIOAndroid/app/build/outputs/apk/debug/app-debug.apk
          
